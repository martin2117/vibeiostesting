# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen
#   xcodegen generate
# then open TechShop.xcodeproj in Xcode and Run (⌘R) on an iPhone Simulator.
name: TechShop
options:
  bundleIdPrefix: com.techshop
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
targets:
  TechShop:
    type: application
    platform: iOS
    sources:
      - TechShop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techshop.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
  TechShopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../../xcuitest/TechShopUITests
    dependencies:
      - target: TechShop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techshop.TechShopUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TechShop

