name: Maestro Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  maestro:
    name: Run Maestro Flows
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Boot iPhone Simulator
        run: |
          echo "Finding available iPhone simulator..."
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable and (.name | contains("iPhone")))][0].udid')
          if [ -z "$DEVICE_ID" ] || [ "$DEVICE_ID" = "null" ]; then
            echo "No available iPhone simulator found, attempting to create one..."
            DEVICE_ID=$(xcrun simctl create "iPhone 15" "com.apple.CoreSimulator.SimDeviceType.iPhone-15")
          fi
          echo "Booting device ID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          echo "Simulator $DEVICE_ID booted successfully."

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Build & Install TechShop App (React Native Fixed)
        working-directory: techshop/reactnative-fixed
        run: |
          npm install
          npx expo run:ios --device "$DEVICE_ID" --configuration Release --no-bundler
          xcrun simctl get_app_container "$DEVICE_ID" com.techshop.ios

      - name: Run Maestro Tests
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          maestro test maestro/flows/ \
            --device "$DEVICE_ID" \
            -e EMAIL="$TEST_EMAIL" \
            -e PASSWORD="$TEST_PASSWORD" \
            --format junit \
            --output maestro-report.xml

      - name: Upload Maestro Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-report
          path: |
            maestro-report.xml
            ~/.maestro/tests/**/*
