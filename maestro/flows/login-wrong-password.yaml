appId: com.techshop.ios
---
# TC-LOG-005: Reject login with incorrect password (BUG-003)
- launchApp:
    clearState: true

- tapOn:
    id: "login-email"
- inputText: ${EMAIL || "demo@techshop.com"}

- tapOn:
    id: "login-password"
- inputText: "wrongpassword"

- tapOn: "Log In"

# Assert user remains on Login screen and validation error is displayed
- assertVisible:
    id: "login-error"

- assertVisible: "Invalid email or password"

# Assert catalog was not reached
- assertNotVisible:
    id: "product-name-p1"
