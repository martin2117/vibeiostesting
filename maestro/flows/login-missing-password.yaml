appId: com.techshop.ios
---
# TC-LOG-003: Reject login submission when password field is missing (BUG-002)
- launchApp:
    clearState: true

- tapOn:
    id: "login-email"
- inputText: ${EMAIL || "demo@techshop.com"}

# Leave password empty and submit
- tapOn: "Log In"

# Assert user remains on Login screen and validation error is displayed
- assertVisible:
    id: "login-error"

- assertVisible: "Email and password are required"

# Assert catalog was not reached
- assertNotVisible:
    id: "product-name-p1"
