appId: com.techshop.ios
---
# TC-CART-003: Decrement item quantity and verify reactive order total reduction (BUG-006)
- launchApp:
    clearState: true

- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${EMAIL || "demo@techshop.com"}
      PASSWORD: ${PASSWORD || "password123"}

- extendedWaitUntil:
    visible:
      id: "add-p1"
    timeout: 5000

- tapOn:
    id: "add-p1"

- tapOn: "Cart"

- extendedWaitUntil:
    visible:
      id: "qty-increment-p1"
    timeout: 5000

# Increment to 2 first
- tapOn:
    id: "qty-increment-p1"

- assertVisible:
    id: "order-total"
    text: ".*120.*"

# Decrement back to 1
- tapOn:
    id: "qty-decrement-p1"

# Assert reactive reduction
- assertVisible:
    id: "qty-p1"
    text: ".*1.*"
- assertVisible:
    id: "line-total-p1"
    text: ".*60.*"
- assertVisible:
    id: "order-total"
    text: ".*60.*"
