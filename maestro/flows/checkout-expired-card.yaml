appId: com.techshop.ios
---
# TC-CHK-007: Reject checkout submission with expired card date (BUG-009)
#
# DEPENDENCY NOTE:
# This flow tests card expiration date validation and is BLOCKED on the broken build by
# BUG-011 (the 'Proceed to Checkout' button is an unresponsive no-op in CartView).
# On the fixed build, it verifies that past card expiry dates are rejected (BUG-009).

- launchApp:
    clearState: true

- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${EMAIL || "demo@techshop.com"}
      PASSWORD: ${PASSWORD || "password123"}

- extendedWaitUntil:
    visible:
      id: "add-p1"
    timeout: 5000

- tapOn:
    id: "add-p1"

- tapOn: "Cart"

- extendedWaitUntil:
    visible:
      id: "proceed-checkout"
    timeout: 5000

- tapOn:
    id: "proceed-checkout"

# Fill fields with expired MM/YY date (01/20)
- extendedWaitUntil:
    visible:
      id: "checkout-firstName"
    timeout: 5000

- tapOn:
    id: "checkout-firstName"
- inputText: "Jane"

- tapOn:
    id: "checkout-lastName"
- inputText: "Doe"

- tapOn:
    id: "checkout-email"
- inputText: "jane.doe@example.com"

- tapOn:
    id: "checkout-phone"
- inputText: "1234567890"

- tapOn:
    id: "checkout-card"
- inputText: "1111222233334444"

- tapOn:
    id: "checkout-expiry"
- inputText: "01/20"

- tapOn:
    id: "checkout-cvv"
- inputText: "123"

- tapOn:
    id: "checkout-submit"

# Assert expiry date error
- assertVisible:
    id: "checkout-error"

- assertVisible: "Expiry date must not be in the past"

- assertNotVisible:
    id: "confirmation-title"
