appId: com.techshop.ios
---
# TC-CART-005: Prevent quantity decrement below minimum threshold of 1 (BUG-005)
- launchApp:
    clearState: true

- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${EMAIL || "demo@techshop.com"}
      PASSWORD: ${PASSWORD || "password123"}

- extendedWaitUntil:
    visible:
      id: "add-p1"
    timeout: 5000

- tapOn:
    id: "add-p1"

- tapOn: "Cart"

- extendedWaitUntil:
    visible:
      id: "qty-decrement-p1"
    timeout: 5000

# Attempt to decrement below minimum 1
- tapOn:
    id: "qty-decrement-p1"

# Assert quantity remains clamped at 1 and total is not corrupted
- assertVisible:
    id: "qty-p1"
    text: ".*1.*"
- assertVisible:
    id: "line-total-p1"
    text: ".*60.*"
- assertVisible:
    id: "order-total"
    text: ".*60.*"
