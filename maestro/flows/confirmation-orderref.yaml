appId: com.techshop.ios
---
# TC-CHK-002: Complete checkout and place order with valid payment details (BUG-013)
#
# DEPENDENCY NOTE:
# This flow tests post-checkout confirmation and is BLOCKED on the broken build by BUG-011
# (the 'Proceed to Checkout' button is an unresponsive no-op in CartView).
# This flow will fail at the 'Proceed to Checkout' step on the broken build and verifies
# successful order creation and order reference generation (BUG-013) on the fixed build.

- launchApp:
    clearState: true

- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${EMAIL || "demo@techshop.com"}
      PASSWORD: ${PASSWORD || "password123"}

- extendedWaitUntil:
    visible:
      id: "add-p1"
    timeout: 5000

- tapOn:
    id: "add-p1"

- tapOn: "Cart"

- extendedWaitUntil:
    visible:
      id: "proceed-checkout"
    timeout: 5000

- tapOn:
    id: "proceed-checkout"

# Fill valid checkout form fields
- extendedWaitUntil:
    visible:
      id: "checkout-firstName"
    timeout: 5000

- tapOn:
    id: "checkout-firstName"
- inputText: "Jane"

- tapOn:
    id: "checkout-lastName"
- inputText: "Doe"

- tapOn:
    id: "checkout-email"
- inputText: "jane.doe@example.com"

- tapOn:
    id: "checkout-phone"
- inputText: "1234567890"

- tapOn:
    id: "checkout-card"
- inputText: "1111222233334444"

- tapOn:
    id: "checkout-expiry"
- inputText: "12/29"

- tapOn:
    id: "checkout-cvv"
- inputText: "123"

# Submit order
- tapOn:
    id: "checkout-submit"

# Assert navigation to Confirmation screen and verify order reference
- extendedWaitUntil:
    visible:
      id: "confirmation-title"
    timeout: 5000

- assertVisible:
    id: "confirmation-title"

- assertVisible: "Order Confirmed"

- assertVisible:
    id: "confirmation-order-ref"
    text: ".*TS-.*"

- assertVisible:
    id: "confirmation-total"
