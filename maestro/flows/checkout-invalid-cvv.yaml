appId: com.techshop.ios
---
# TC-CHK-008: Reject checkout submission with non-3-digit CVV (BUG-010)
#
# DEPENDENCY NOTE:
# This flow tests CVV digit validation and is BLOCKED on the broken build by BUG-011
# (the 'Proceed to Checkout' button is an unresponsive no-op in CartView).
# On the fixed build, it verifies that CVV with incorrect digit count is rejected (BUG-010).

- launchApp:
    clearState: true

- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${EMAIL || "demo@techshop.com"}
      PASSWORD: ${PASSWORD || "password123"}

- extendedWaitUntil:
    visible:
      id: "add-p1"
    timeout: 5000

- tapOn:
    id: "add-p1"

- tapOn: "Cart"

- extendedWaitUntil:
    visible:
      id: "proceed-checkout"
    timeout: 5000

- tapOn:
    id: "proceed-checkout"

# Fill fields with invalid 2-digit CVV
- extendedWaitUntil:
    visible:
      id: "checkout-firstName"
    timeout: 5000

- tapOn:
    id: "checkout-firstName"
- inputText: "Jane"

- tapOn:
    id: "checkout-lastName"
- inputText: "Doe"

- tapOn:
    id: "checkout-email"
- inputText: "jane.doe@example.com"

- tapOn:
    id: "checkout-phone"
- inputText: "1234567890"

- tapOn:
    id: "checkout-card"
- inputText: "1111222233334444"

- tapOn:
    id: "checkout-expiry"
- inputText: "12/29"

- tapOn:
    id: "checkout-cvv"
- inputText: "12"

- tapOn:
    id: "checkout-submit"

# Assert CVV validation error
- assertVisible:
    id: "checkout-error"

- assertVisible: "CVV must be 3 digits"

- assertNotVisible:
    id: "confirmation-title"
